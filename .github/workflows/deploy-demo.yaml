# Builds the demo (examples/react) and publishes it on GitHub Pages: https://nonodev96.github.io/handsign-multilingual/
#
# Set it up once: repository Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - examples/react/**
      - packages/handsign-multilingual/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-demo.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, without cancelling the one in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version of pnpm comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The demo uses the library from its dist
      - run: pnpm build:package

      # Also writes 404.html (a copy of index.html), so that GitHub Pages serves the app on every route
      - run: pnpm build:react

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
